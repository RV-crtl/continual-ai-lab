name: Online multi-agent verified learning (CPU)
on:
  push:
    branches: [main]
    paths:
      - 'continual_ai/**'
      - 'tests/**'
      - '.github/workflows/online-learning.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloud-learning-state
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAI_MODEL: qwen3:1.7b
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test controller (must pass before learning)
        run: python -m unittest discover -s tests -v
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh
      - name: Start CPU inference
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$CAI_MODEL"
      - name: Execute learning, optimiser and independent verifier (50% inference-call budget)
        run: python -m continual_ai.multi_agent cloud --cycles 2 --max-seconds 1100 --state-dir data/cloud
      - name: Commit only verified online records
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cloud/attempts.jsonl data/cloud/verified_examples.jsonl data/cloud/state.json data/cloud/summary.md data/cloud/agent_state.json data/cloud/agent_cycles.jsonl || true
          if git diff --cached --quiet; then
            echo 'No new verified state to commit.'
          else
            git commit -m 'data: persist multi-agent learning and independent verification'
            git push
          fi
